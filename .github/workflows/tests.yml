# Runs the test suite on every pull request into main, and on main itself after a merge.
# Branch protection on main can require the "pytest" check below (see CONTRIBUTING.md).
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.5"   # the same uv as docker/Dockerfile

      # The editor's browser code that runs in Node (tests/js, through tests/test_js.py) needs 22.15+.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Open3D's wheel links libGL and libgomp even when nothing is drawn.
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgl1 libegl1 libgomp1

      # The tested versions first (requirements-lock.txt), then this checkout itself, editable and
      # without dependencies, so the tests import the code under review and not another copy.
      - name: Install
        run: |
          uv venv -p 3.12
          uv pip install -r requirements-lock.txt
          uv pip install --no-deps -e '.[mask,dev]'

      - name: Tests import this checkout
        run: |
          .venv/bin/python - <<'PY'
          import os, pathlib, motiongrammetry
          src = pathlib.Path(os.environ["GITHUB_WORKSPACE"], "src").resolve()
          here = pathlib.Path(motiongrammetry.__file__).resolve()
          print("motiongrammetry", motiongrammetry.__version__, "from", here)
          assert here.is_relative_to(src), f"imported {here}, not the checkout in {src}"
          PY

      # The browser tests (tests/browser) drive the pages in headless Chromium. The browser is the one
      # the locked Playwright wants, cached by that version; its system libraries come from apt each time.
      - name: Browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-lock.txt') }}

      - name: Browser
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            .venv/bin/playwright install-deps chromium-headless-shell
          else
            .venv/bin/playwright install --with-deps chromium-headless-shell
          fi

      # MG_BROWSER_TESTS=required: the browser tests fail rather than skip if the browser is missing,
      # so a green run means they ran. On a failure, each failed browser test leaves a trace and a
      # screenshot in test-results/ (uploaded below).
      - name: pytest
        env:
          MG_BROWSER_TESTS: required
        run: >-
          .venv/bin/python -m pytest tests/ -q -rsx
          --tracing retain-on-failure --screenshot only-on-failure --output test-results
          --junitxml test-results/junit.xml

      - name: Browser tests ran
        run: |
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = [c for c in ET.parse("test-results/junit.xml").iter("testcase") if c.get("classname", "").startswith("tests.browser.")]
          skipped = [c.get("name") for c in cases if any(s.get("type") != "pytest.xfail" for s in c.iter("skipped"))]
          print(f"{len(cases)} browser tests, {len(skipped)} skipped")
          assert cases and not skipped, f"the browser tests did not all run: {skipped or 'none collected'}"
          PY

      - name: Traces and screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
