[project]
name = "motiongrammetry"
version = "0.1.0"
description = "Turn a walk-around video of a person or object into a cleaned, textured 3D mesh."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Joan Pagès" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pycolmap>=4.0",
    "open3d>=0.19",
    "trimesh>=4.4",
    "scikit-image>=0.22",
    "pillow>=10",
    "scipy>=1.11",
    "xatlas>=0.0.11",  # packs the editor's rebuilt texture layout (atlas.py)
]

[project.optional-dependencies]
# Subject segmentation (BiRefNet / U2Net via ONNX); runs fine on CPU.
mask = ["rembg>=2.0.60", "onnxruntime>=1.18"]
# Feed-forward reconstruction (VGGT). Wants a CUDA GPU; works on CPU for ~20-30 frames.
vggt = ["torch>=2.3", "torchvision>=0.18", "huggingface_hub>=0.23", "einops", "safetensors"]  # plus: uv pip install --no-deps git+https://github.com/facebookresearch/vggt
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/jpagesbri/motiongrammetry"
Repository = "https://github.com/jpagesbri/motiongrammetry"
Changelog = "https://github.com/jpagesbri/motiongrammetry/blob/main/CHANGELOG.md"

[project.scripts]
mg = "motiongrammetry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
